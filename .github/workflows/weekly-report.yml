name: Weekly report

# Runs the sourcing scripts once a week, regenerates the HTML report + landing
# page, and commits them so GitHub Pages republishes the site.
on:
  schedule:
    # 14:00 UTC every Monday (~6-7am Pacific). Actions cron is always UTC.
    - cron: "0 14 * * 1"
  workflow_dispatch: {}   # allow running it manually from the Actions tab

permissions:
  contents: write         # lets the job commit the refreshed report back

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly sourcing + build report
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          MARKETCHECK_API_KEY: ${{ secrets.MARKETCHECK_API_KEY }}
        run: python -m taormina_tools.run_weekly

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Weekly report: $(date -u +%Y-%m-%d)"
            git push
          fi
